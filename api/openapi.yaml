  /entityDump:
    get:
      tags:
        - Bulk
      summary: Bulk export of all platform entities
      description: |
        Returns every person, organisation, term and document the platform holds, as a flat
        list of `id` / `label` / `labelAlternative` / `type` / `subType` records. Intended for
        named-entity-linking pipelines that need the full label set offline; use `/search/*`
        for ordinary lookups.

        The response is **not** wrapped in the standard envelope — the body is a bare
        `{meta, data}` object whose `meta` carries per-type counts.

        `/entityDump/{type}` and `?type={type}` are equivalent; `?type=` wins if both are given.
        The pre-1.0 path `/data/entity-dump` permanently redirects here.
      parameters:
        - name: type
          in: query
          description: Entity type to export. `all` combines every type.
          required: false
          schema:
            type: string
            enum: [all, person, organisation, term, document]
            default: all
        - name: exclude_person
          in: query
          description: With `type=all`, omit people. Same for `exclude_organisation`, `exclude_term`, `exclude_document`.
          required: false
          schema:
            type: boolean
        - name: wiki
          in: query
          description: Restrict the result to entities whose id is a Wikidata id
          required: false
          schema:
            type: boolean
        - name: wikikeys
          in: query
          description: With `wiki`, return `data` as an object keyed by Wikidata id instead of an array
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Entity dump
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    description: Per-type counts (`people_count`, `organisations_count`, `terms_count`, `documents_count`) and `total_count`
                  data:
                    oneOf:
                      - type: array
                        items:
                          $ref: '#/components/schemas/EntityDumpItem'
                      - type: object
                        additionalProperties:
                          $ref: '#/components/schemas/EntityDumpItem'

  /entityDump/{type}:
    get:
      tags:
        - Bulk
      summary: Bulk export of one entity type
      description: Path-segment form of `/entityDump?type={type}`.
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [all, person, organisation, term, document]
        - name: wiki
          in: query
          required: false
          schema:
            type: boolean
        - name: wikikeys
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Entity dump
          content:
            application/json:
              schema:
                type: object

  /statistics/general:
    get:
      tags:
        - Statistics
      summary: Aggregate statistics for a parliament, optionally scoped
      description: |
        Speech counts, speaker counts, speaking time and top vocabulary, each broken down
        by faction.

        Without a scope this describes the whole corpus and is served from a cache that is
        recomputed after every import. Adding any scope parameter narrows every figure in
        the response to that subset — this is the same endpoint the per-session,
        per-agendaItem and per-entity statistics modules call.

        Scope parameter names match those of `/search/media`, so filters applied to a
        result list can be passed here unchanged.
      parameters:
        - name: parliament
          in: query
          description: Parliament key. Defaults to the instance's first configured parliament.
          required: false
          schema:
            type: string
        - name: sessionID
          in: query
          description: Restrict to one sitting, e.g. `DE-0210010`.
          required: false
          schema:
            type: string
        - name: agendaItemID
          in: query
          description: Restrict to one agenda item.
          required: false
          schema:
            type: string
        - name: electoralPeriodID
          in: query
          description: Restrict to one electoral period, e.g. `DE-021`.
          required: false
          schema:
            type: string
        - name: factionID
          in: query
          description: Restrict to speeches whose main speaker belonged to this faction.
          required: false
          schema:
            type: string
        - name: personID
          in: query
          description: Restrict to speeches by this person as main speaker.
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema:
                type: object

  /statistics/word-trends:
    get:
      tags:
        - Statistics
      summary: Word frequency over time
      description: |
        Monthly frequency of one or more words, optionally split by faction.

        **Grouping.** By default each word is matched by its stem, so `flüchtlinge` also
        counts `flüchtling` and `flüchtlingen` and the three appear as one line. The
        `forms` array of each result lists the surface forms actually covered, so a chart
        can label the line honestly. Pass `match=exact` to count only the form given.

        **Normalisation.** `normalize=relative` adds `tokenCount` to every bucket: the
        total number of words spoken in the same scope and month. A rate per million words
        is `totalCount / tokenCount * 1000000`. The denominator is returned rather than the
        rate so that a client can switch between absolute and relative display without
        another request.

        **First use** is reported per word as `firstUse`, and means first recorded on this
        platform — not the first time the word was ever spoken in this parliament. The
        corpus begins at the start of the earliest electoral period on record, which is
        also the default `startDate`.
      parameters:
        - name: words
          in: query
          description: One or more words. Repeat as `words[]=a&words[]=b`.
          required: true
          schema:
            type: array
            items:
              type: string
        - name: parliament
          in: query
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          description: Defaults to the start of the earliest electoral period.
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Defaults to today.
          required: false
          schema:
            type: string
            format: date
        - name: match
          in: query
          description: Group inflected forms by stem, or count the exact form only.
          required: false
          schema:
            type: string
            enum: [stem, exact]
            default: stem
        - name: normalize
          in: query
          description: With `relative`, each bucket also carries `tokenCount`.
          required: false
          schema:
            type: string
            enum: [absolute, relative]
            default: absolute
        - name: factions
          in: query
          description: Restrict to speeches by these factions.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: separateByFaction
          in: query
          description: Return one timeline per faction instead of a combined one.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Word trends
          content:
            application/json:
              schema:
                type: object

  /statistics/significant-words:
    get:
      tags:
        - Statistics
      summary: Words that characterise a scope
      description: |
        The vocabulary that distinguishes a scope from the rest of the corpus, rather than
        the words it uses most — a top-words list for any large scope returns much the same
        common nouns whatever the scope is.

        At least one scope parameter is required; "what characterises everything" has no
        answer, and a request without one returns 422.

        Words are reported in their most frequent written form. Internally the comparison
        runs over stemmed text, so `word` is the surface form and `stem` the token behind
        it. `score` is a distinctiveness measure, not a count; `speechCount` is how many
        speeches in the scope contain the word.
      parameters:
        - name: sessionID
          in: query
          required: false
          schema:
            type: string
        - name: agendaItemID
          in: query
          required: false
          schema:
            type: string
        - name: electoralPeriodID
          in: query
          required: false
          schema:
            type: string
        - name: factionID
          in: query
          required: false
          schema:
            type: string
        - name: personID
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: size
          in: query
          description: Number of words to return.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
        - name: parliament
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Distinctive words
          content:
            application/json:
              schema:
                type: object
        '422':
          description: No scope parameter was given

  /statistics/entity:
    get:
      tags:
        - Statistics
      summary: Statistics for one entity
      description: |
        How often an entity appears, who it appears alongside, and — for people — the words
        they use most.

        `mentionsOverTime` counts speeches that mention the entity, excluding the contexts
        in which it is structurally present: a person's own speeches are not mentions of
        them, and a faction is not mentioned merely by one of its members speaking.

        Documents can carry two series, because being formally on the agenda (`linked`)
        and being named mid-speech (`mentioned`) are different events. In practice a given
        document tends to have only one of them — in the German corpus the two populations
        do not overlap at all — so expect one series to be empty.
      parameters:
        - name: entityType
          in: query
          required: true
          schema:
            type: string
            enum: [person, organisation, document, term]
        - name: entityID
          in: query
          required: true
          schema:
            type: string
        - name: parliament
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Entity statistics
          content:
            application/json:
              schema:
                type: object
        '422':
          description: entityType or entityID missing

  /statistics/entity/{entityType}/{entityID}:
    get:
      tags:
        - Statistics
      summary: Statistics for one entity (path form)
      description: Path-segment form of `/statistics/entity?entityType=…&entityID=…`.
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [person, organisation, document, term]
        - name: entityID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity statistics
          content:
            application/json:
              schema:
                type: object

  /statistics/entity-counts:
    get:
      tags:
        - Statistics
      summary: How many entities the platform holds
      description: |
        Counts of people, organisations, documents and terms, with a per-subtype breakdown.

        These counts are **platform-wide**: entities are shared across all parliaments an
        instance serves, so unlike the other statistics endpoints this one takes no
        `parliament` parameter and is unaffected by one.
      responses:
        '200':
          description: Entity counts
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Optional API key raising the caller's rate limit. It is not an authentication
        mechanism: it grants no additional access, and every endpoint remains available
        without it. Requests carrying a valid key are counted per key instead of per IP.
        Keys are issued on request. A key that is unknown, revoked or expired is rejected
        with `403`. Clients unable to set headers may pass the key as an `?apikey=` query
        parameter instead, at the cost of it appearing in server access logs.

  responses:
    RateLimited:
      description: Too Many Requests — rate limit exceeded (counted per API key when one is presented, otherwise per IP)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            meta:
              api:
                version: "1.0"
                documentation: "https://de.openparliament.tv/api"
                license:
                  label: "ODC Open Database License (ODbL) v1.0"
                  link: "https://opendatacommons.org/licenses/odbl/1-0/"
              requestStatus: "error"
            errors:
              - status: "429"
                code: "RATE_LIMIT_EXCEEDED"
                title: "Too Many Requests"
                detail: "Rate limit exceeded. Please slow down or request an API key for higher limits."
                meta:
                  retryAfter: 42

  schemas:
    EntityDumpItem:
      type: object
      description: One record in the bulk entity export. `id` is a Wikidata id, except for
        documents, where it may be empty and `optvID` carries the platform id.
      properties:
        id:
          type: string
        label:
          type: string
        labelAlternative:
          type: array
          items:
            type: string
          nullable: true
        type:
          type: string
          enum: [person, organisation, term, document]
        subType:
          type: string
          nullable: true
        firstname:
          type: string
          nullable: true
          description: People only
        lastname:
          type: string
          nullable: true
          description: People only
        optvID:
          type: integer
          nullable: true
          description: Documents only — the platform-internal document id

    MediaSearchResponse:
      type: object
      description: |
        Media (speech) search response. Note the media search meta differs from the entity
        search meta: it carries a `results` object and date-range `attributes` instead of
        `page`/`pageTotal`. Pagination is driven by the `page`/`limit` request parameters,
        and `links` carries the full set (`self`, `first`, `prev`, `next`, `last`) built from
        those same parameters. `prev` is `null` on the first page and `next` is `null` on the
        last one. `last` is capped at the largest page the search backend can serve, so it
        may describe fewer pages than `results.total` implies. When `getAllResults` is set the
        response is a single complete set and only `self` is returned.
      properties:
        meta:
          type: object
          properties:
            api:
              $ref: '#/components/schemas/ApiMeta'
            requestStatus:
              type: string
              enum: [success, error]
            attributes:
              type: object
              properties:
                speechFirstDateStr:
                  type: string
                  nullable: true
                speechFirstDateTimestamp:
                  type: integer
                  nullable: true
                speechLastDateStr:
                  type: string
                  nullable: true
                speechLastDateTimestamp:
                  type: integer
                  nullable: true
                resultsPerFaction:
                  type: array
                  items:
                    type: object
                days:
                  type: array
                  items:
                    type: object
            results:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of items on this page
                total:
                  type: integer
                  description: Total number of matching items
                totalHits:
                  type: integer
        data:
          type: array
          items:
            type: object
        links:
          $ref: '#/components/schemas/PaginationLinks'

    EntitySearchResponse:
      type: object
      description: |
        Entity search response (people, organisations, documents, terms, electoral periods).
        The meta carries the current `page` and total `pageTotal` count, and `links` carries
        the full set (`self`, `first`, `prev`, `next`, `last`) built from the `page`/`limit`
        request parameters. `prev` is `null` on the first page and `next` is `null` on the
        last one.
      properties:
        meta:
          type: object
          properties:
            api:
              $ref: '#/components/schemas/ApiMeta'
            requestStatus:
              type: string
              enum: [success, error]
            page:
              type: integer
            pageTotal:
              type: integer
        data:
          type: array
          items:
            type: object
        links:
          $ref: '#/components/schemas/PaginationLinks'

    PaginationLinks:
      type: object
      description: |
        JSON:API pagination links for a collection response. Every link repeats the request's
        own filter parameters and differs only in `page`, so a client can walk a result set by
        following them. Links that do not exist are present as `null` rather than omitted, so
        the object has the same shape on every page.
      properties:
        self:
          type: string
          description: The page that was requested
        first:
          type: string
        prev:
          type: string
          nullable: true
          description: '`null` on the first page'
        next:
          type: string
          nullable: true
          description: '`null` on the last page'
        last:
          type: string

    AutocompleteResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: array
          items:
            type: object
        links:
          type: object
          properties:
            self:
              type: string

    IIIFResource:
      type: object
      description: |
        A IIIF Presentation API 3.0 resource (Manifest or Collection) as JSON-LD. Served with
        `Content-Type: application/ld+json` and `Access-Control-Allow-Origin: *`. See
        https://iiif.io/api/presentation/3.0/ for the full structure.
      properties:
        '@context':
          type: string
          example: http://iiif.io/api/presentation/3/context.json
        id:
          type: string
        type:
          type: string
          enum: [Manifest, Collection]
        label:
          type: object

    ErrorResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            api:
              $ref: '#/components/schemas/ApiMeta'
            requestStatus:
              type: string
              enum: [error]
        errors:
          type: array
          items:
            type: object
            properties:
              meta:
                type: object
                properties:
                  domSelector:
                    type: string
                  retryAfter:
                    type: integer
              status:
                type: string
              code:
                type: string
              title:
                type: string
              detail:
                type: string
        links:
          type: object
          properties:
            self:
              type: string

    MediaResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: object
          properties:
            type:
              type: string
              enum: [media]
